name: Cleanup Old Workflow Runs

on:
  schedule:
    # Executa toda segunda-feira às 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Permite executar manualmente pela aba "Actions"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Permissão necessária para deletar execuções
      contents: read

    steps:
      - name: Deletar execuções antigas de workflow
        uses: Mattraks/delete-workflow-runs@v2
        with:
          # O token é fornecido automaticamente pelo GitHub
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          # Mantém as 50 execuções mais recentes de cada workflow
          keep_minimum_runs: 50
          # (Opcional) Também deleta execuções com mais de 30 dias, além do limite acima
          delete_older_than: 30
